[project]
name = "agentic_python_tools"
version = "0.0.1"
description = "Python Tools for Agentic Engineering"
readme = "README.md"
authors = [
    { name = "David Vujic" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.5",
    "ipykernel>=7.4.0",
]

[dependency-groups]
dev = [
    "polylith-cli>=1.50.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.workspace]
members = ["projects/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
cache-dir = ".ruff_cache"

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.polylith.bricks]
"bases/agenticpytools/repl_mcp" = "agenticpytools/repl_mcp"
"components/agenticpytools/environment" = "agenticpytools/environment"
"components/agenticpytools/kernel" = "agenticpytools/kernel"
"components/agenticpytools/storage" = "agenticpytools/storage"
"components/agenticpytools/linter" = "agenticpytools/linter"
