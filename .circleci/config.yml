version: 2.1

parameters:
  python-image:
    type: string
    default: cimg/python:3.14

orbs:
  python: circleci/python@4.0.0

commands:
  setup:
    description: Checkout code and install dependencies with uv
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
          args: --frozen

jobs:
  lint:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Lint
          command: uv run ruff check
      - run:
          name: Check formatting
          command: uv run ruff format --check
      - run:
          name: Type check
          command: uv run ty check

  test:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Run unit tests
          command: uv run pytest

  test-changed:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Run tests for changed bricks only
          command: bash scripts/ci/test-changed.sh

  build:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Build wheels and requirements for changed projects
          command: bash scripts/ci/build.sh
      - persist_to_workspace:
          root: artifacts
          paths:
            - "*"
            - "**/*"

  deploy:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - attach_workspace:
          at: artifacts
      - run:
          name: Install changed projects from built artifacts and smoke-test
          command: bash scripts/ci/deploy.sh

workflows:
  ci:
    jobs:
      - lint
      - test-changed:
          filters:
            branches:
              ignore:
                - main
      - test:
          filters:
            branches:
              only:
                - main
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main
