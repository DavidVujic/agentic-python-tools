version: 2.1

orbs:
  python: circleci/python@4.0.0

jobs:
  test:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
          args: --frozen
      - run:
          name: Run unit tests
          command: uv run pytest
      - run:
          name: Lint
          command: uv run ruff check
      - run:
          name: Check formatting
          command: uv run ruff format --check
      - run:
          name: Type check
          command: uv run ty check

workflows:
  ci:
    jobs:
      - test
