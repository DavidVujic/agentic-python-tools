version: 2.1

parameters:
  python-image:
    type: string
    default: cimg/python:3.14

orbs:
  python: circleci/python@4.0.0

commands:
  setup:
    description: Checkout code and install dependencies with uv
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: uv
          args: --frozen

jobs:
  lint:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Lint
          command: uv run ruff check
      - run:
          name: Check formatting
          command: uv run ruff format --check
      - run:
          name: Type check
          command: uv run ty check

  test:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Run unit tests
          command: uv run pytest

  test-changed:
    docker:
      - image: << pipeline.parameters.python-image >>
    steps:
      - setup
      - run:
          name: Run tests for changed bricks only
          command: |
            changes="$(uv run poly diff --bricks --short)"

            if [ -z "$changes" ] || [ "$changes" = "No matching tags or commits found in repository." ]; then
              echo "No changed bricks since the latest stable-* tag; nothing to run"
              exit 0
            fi

            query="${changes//,/ or }"
            echo "Changed bricks: $changes -> pytest -m \"$query\""

            uv run pytest -m "$query" -q || [ $? -eq 5 ]

workflows:
  ci:
    jobs:
      - lint
      - test-changed:
          filters:
            branches:
              ignore:
                - main
      - test:
          filters:
            branches:
              only:
                - main
