[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "agent-repl-mcp"
version = "0.1.0"
description = "A Python REPL that agents can use during development"
authors = [{ name = "David Vujic" }]
repository = "https://github.com/DavidVujic/agentic-python-tools"
license = "MIT"
readme = "README.md"

requires-python = ">=3.12"
dependencies = ["fastmcp", "ipykernel"]

[project.scripts]
agent-repl-mcp = "agent_repl_mcp.agenticpytools.repl_mcp.core:main"

[tool.hatch.build.hooks.polylith-bricks]

[tool.hatch.build.targets.wheel]
packages = ["agent_repl_mcp"]

[tool.polylith.build]
top-namespace = "agent_repl_mcp"

[tool.polylith.bricks]
"../../bases/agenticpytools/repl_mcp" = "agenticpytools/repl_mcp"
"../../components/agenticpytools/environment" = "agenticpytools/environment"
"../../components/agenticpytools/kernel" = "agenticpytools/kernel"
"../../components/agenticpytools/storage" = "agenticpytools/storage"
